<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="canonical" href="https://cuhk-campus-guide.github.io/demos/shuttle-atlas/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>中大校巴 · 站点索引版</title>
  <link rel="stylesheet" href="single-line.css?v=1c7a821556fa3517">
  <link rel="stylesheet" href="../../assets/i18n.css?v=4cece3170833afe0">
  <script src="../../assets/vendor/opencc-full.js?v=95b04abf136d9c28"></script>
  <script src="../../assets/i18n.js?v=ad719104bc42c297"></script>
  <script src="atlas-i18n.js?v=6517a000dbfeb0b1"></script>
  <script defer src="../ui-modes/assets/lucide.js?v=3411692820cb8d47"></script>
  <script defer src="../../data/cuhk_bus_routes.js?v=3a29ca0e8602027c"></script>
  <script defer src="../../data/transport_route_schemes.js?v=1cae822168fa0e6a"></script>
  <script defer src="topology.js?v=91777a0d3ff40055"></script>
  <script defer src="single-line-model.js?v=aee7000bc9bb4fab"></script>
  <script defer src="single-line.js?v=55e6f97fa7cc2611"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="identity"><i data-lucide="bus-front" aria-hidden="true"></i><div><h1>穿梭校巴</h1><p>香港中文大学</p></div></div>
      <div class="edition"><span></span>站点索引</div>
      <a class="icon-button" href="./" aria-label="查看 A1 并线版" data-tooltip="A1 并线版"><i data-lucide="git-compare-arrows"></i></a>
    </header>
    <main>
      <div class="map-status"><span id="caption">全部穿梭线路</span><span id="count">8 条线路 · 23 站</span></div>
      <div id="map" tabindex="0" aria-label="可缩放穿梭校巴拓扑图">
        <svg id="network" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="站点与途经线路"><g id="drawing"></g></svg>
      </div>
      <aside id="detail" hidden aria-live="polite"></aside>
      <div class="tools">
        <button class="icon-button" id="zoom-in" aria-label="放大" data-tooltip="放大"><i data-lucide="plus"></i></button>
        <button class="icon-button" id="zoom-out" aria-label="缩小" data-tooltip="缩小"><i data-lucide="minus"></i></button>
        <button class="icon-button" id="fit" aria-label="查看全图" data-tooltip="查看全图"><i data-lucide="scan"></i></button>
      </div>
      <div class="map-note"><span class="legend-dot"></span>停靠站<span class="legend-number">1</span>途经线路<span class="note-end">线路示意 · 非地理比例</span></div>
    </main>
    <footer><button id="reset" class="icon-button" aria-label="全部线路" data-tooltip="全部线路"><i data-lucide="rotate-ccw"></i></button><nav id="routes" aria-label="选择校巴线路"></nav></footer>
  </div>
</body>
</html>
